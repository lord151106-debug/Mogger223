name: Build ksud
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      pack_lkm:
        required: false
        type: boolean
        default: false
      pack_ksuinit:
        required: false
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v8
    
    - name: Prepare and validate complete supported LKM bundle
      if: ${{ inputs.pack_lkm }}
      shell: bash
      run: |
        set -euo pipefail

        # These are the KMI targets built by build-lkm.yml. Keep this list in
        # sync with that workflow so a missing artifact cannot silently produce
        # an APK with only a partial LKM collection.
        SUPPORTED_KMIS=(
          android12-5.10
          android13-5.10
          android13-5.15
          android14-5.15
          android14-6.1
          android15-6.6
          android16-6.12
          android17-6.18
        )

        for arch in aarch64 x86_64; do
          destination="./userspace/ksud/bin/$arch"
          mkdir -p "$destination"

          for kmi in "${SUPPORTED_KMIS[@]}"; do
            source_dir="${arch}-${kmi}-lkm"
            source_file="$source_dir/${kmi}_kernelsu.ko"
            test -s "$source_file" || {
              echo "ERROR: missing or empty LKM artifact: $source_file"
              exit 1
            }
            cp -f "$source_file" "$destination/${kmi}_kernelsu.ko"
          done

          echo "Embedded LKM inventory for $arch:"
          for kmi in "${SUPPORTED_KMIS[@]}"; do
            test -s "$destination/${kmi}_kernelsu.ko"
            sha256sum "$destination/${kmi}_kernelsu.ko"
          done

          actual_count=$(find "$destination" -maxdepth 1 -type f -name '*_kernelsu.ko' | wc -l)
          expected_count="${#SUPPORTED_KMIS[@]}"
          test "$actual_count" -eq "$expected_count" || {
            echo "ERROR: expected $expected_count LKM files for $arch, found $actual_count"
            exit 1
          }
        done

        echo "Validated all ${#SUPPORTED_KMIS[@]} KMI modules for arm64 and x86_64."
        echo "No RISC-V LKM is built by build-lkm.yml; RISC-V ksud must not be described as supporting bundled RISC-V kernel modules."
    
    - name: Prepare ksuinit
      if: ${{ inputs.pack_ksuinit }}
      run: |
        mv ksuinit-aarch64/ksuinit ./userspace/ksud/bin/aarch64/
        mv ksuinit-x86_64/ksuinit ./userspace/ksud/bin/x86_64/
        mv ksuinit-riscv64/ksuinit ./userspace/ksud/bin/riscv64/
        
    - name: Setup rustup
      run: |
        if [ "${{ inputs.target }}" = riscv64-linux-android ]; then
          rustup toolchain install nightly-2026-09-23 --profile minimal --component rust-src
        else
          rustup update stable
          rustup target add ${{ inputs.target }}
        fi

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: userspace/ksud
        cache-targets: false

    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29

    - name: Build ksud
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          export KSU_PACKAGE_NAME="avi.aviatorcrashgametofly.casino.pr"
        else
          export KSU_PACKAGE_NAME="avi.aviatorcrashgametofly.casino"
        fi
        if [ "${{ inputs.target }}" = riscv64-linux-android ]; then
          source .github/scripts/setup-rust-build.sh riscv64-linux-android 35
          cargo +nightly-2026-09-23 build --config .github/riscv64-cargo.toml -Z build-std=std,panic_abort --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml
        else
          source .github/scripts/setup-rust-build.sh ${{ inputs.target }} 26
          cargo build --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml
        fi

    - name: Upload ksud artifact
      uses: actions/upload-artifact@v7
      with:
        name: ksud-${{ inputs.target }}
        path: target/${{ inputs.target }}/release/ksud
